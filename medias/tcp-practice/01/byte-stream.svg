<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" aria-labelledby="title desc"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#397eab" stroke-width="1.5"/></marker></defs><rect width="900" height="580" rx="24" fill="#f5f9fd"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#21384c" font-size="24"><text x="450" y="47" text-anchor="middle" font-weight="bold">序号按字节计, 确认先等缺口补齐</text><text x="140" y="95" text-anchor="middle">发送端</text><text x="760" y="95" text-anchor="middle">接收端</text><path d="M140 115v375m620-375v375" stroke="#b6cbdc" stroke-width="3"/><g stroke="#397eab" stroke-width="2.5" marker-end="url(#a)"><path d="m150 145 600 40"/><path d="m150 220 293 20" stroke-dasharray="8 6"/><path d="m150 300 600 40"/><path d="m150 420 600 40"/><path d="m750 495-600 40"/></g><g fill="#f5f9fd"><path d="M275 110h350v38H275zM275 270h350v38H275zM275 385h350v38H275zM345 480h210v38H345z"/></g><text x="450" y="137" text-anchor="middle">ABCD · [1000, 1004)</text><text x="245" y="266" fill="#b35c36">EFGH 丢失</text><path d="m436 229 22 22m0-22-22 22" stroke="#b35c36" stroke-width="3"/><text x="450" y="296" text-anchor="middle">IJKL · [1008, 1012)</text><text x="450" y="412" text-anchor="middle">重传 EFGH · [1004, 1008)</text><text x="450" y="508" text-anchor="middle" fill="#177e71">ACK = 1012</text><text x="745" y="222" text-anchor="end" font-size="22">连续收到 ABCD</text><text x="745" y="250" text-anchor="end" font-size="22">下一字节: 1004</text><text x="745" y="370" text-anchor="end" font-size="22">缓存 IJKL, ACK 仍为 1004</text><text x="450" y="568" text-anchor="middle" font-size="20" fill="#526f85">教学示意: 缺口补齐后, 才得到完整的 ABCDEFGHIJKL</text></g></svg>