<svg xmlns="http://www.w3.org/2000/svg" width="420" height="700" aria-label="累计确认停在缺口之前, 补齐后推进到1012"><rect width="420" height="700" rx="20" fill="#f5f9fd"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#21384c" text-anchor="middle"><text x="210" y="40" font-size="24" font-weight="bold">接收端如何补齐字节流</text><text x="210" y="73" font-size="18" fill="#526f85">教学示例 · 每段 4 字节</text><g fill="#e6f0fc" stroke="#96b9d4" stroke-width="2"><rect x="25" y="100" width="370" height="105" rx="14"/><rect x="25" y="340" width="370" height="105" rx="14"/></g><rect x="25" y="220" width="370" height="105" rx="14" fill="#fff1e9" stroke="#d4aa91" stroke-width="2"/><rect x="25" y="460" width="370" height="130" rx="14" fill="#e1f4ee" stroke="#85bfb2" stroke-width="2"/><g font-size="22"><text x="210" y="133">① 收到 ABCD</text><text x="210" y="165">字节范围 [1000, 1004)</text><text x="210" y="191">下一字节: 1004</text><text x="210" y="253">② EFGH 丢失</text><text x="210" y="285">缺口 [1004, 1008)</text><text x="210" y="311">还不能交付后面的字节</text><text x="210" y="373">③ 收到并缓存 IJKL</text><text x="210" y="405">字节范围 [1008, 1012)</text><text x="210" y="431">ACK 仍为 1004</text><text x="210" y="493">④ 重传的 EFGH 到达</text><text x="210" y="525">缺口补齐, 连续收到 12 字节</text><text x="210" y="565" font-weight="bold" fill="#177e71">ACK 推进到 1012</text></g><text x="210" y="637" font-size="21">按序交付 ABCDEFGHIJKL</text><text x="210" y="672" font-size="18" fill="#526f85">ACK 表示下一次期望的字节序号</text></g></svg>