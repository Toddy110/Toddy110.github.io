<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1200" aria-labelledby="title desc"><defs><marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="m0 0 9 4.5L0 9Z" fill="#3039ba"/></marker><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m0 0 7 3.5L0 7Z" fill="#68727e"/></marker><g id="a" stroke="#4f5b70" stroke-width="2"><rect x="-25" y="-22" width="50" height="33" rx="2" fill="#edf0f6"/><path d="M-3 11v9m-14 0h34" fill="none"/></g></defs><path fill="#fff" d="M0 0h660v1200H0z"/><g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" fill="#24282f"><text x="330" y="49" font-size="31" fill="#20269b" text-anchor="middle">丢失、重传与累计确认</text><text x="105" y="99" font-size="28" text-anchor="middle">发送端</text><text x="555" y="99" font-size="28" text-anchor="middle">接收端</text><use href="#a" x="105" y="139"/><use href="#a" x="555" y="139"/><g stroke="#9aa1ab" stroke-width="1.7" marker-end="url(#b)"><path d="M105 175v905"/><path d="M555 175v905"/></g><g fill="none" stroke="#3039ba" stroke-width="3" marker-end="url(#c)"><path d="m105 190 450 60"/><path d="m555 307-450 60"/><path d="m105 515 450 60"/><path d="m555 635-450 60"/><path d="m105 875 450 60"/><path d="m555 995-450 60"/></g><path d="m105 415 317 43" fill="none" stroke="#3039ba" stroke-width="3"/><g font-size="27" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="10" stroke-linejoin="round"><text x="330" y="212">Seq=1000，ABCD</text><text x="330" y="335">ACK=1004</text><text x="299" y="433">Seq=1004，EFGH</text><text x="330" y="538">Seq=1008，IJKL</text><text x="330" y="663" fill="#c02c29">ACK=1004</text><text x="330" y="899">Seq=1004，重传 EFGH</text><text x="330" y="1023" fill="#c02c29">ACK=1012</text></g><g font-size="25" text-anchor="end"><text x="551" y="283">ABCD 连续收到</text><text x="551" y="608">缓存 IJKL，仍缺 EFGH</text><text x="551" y="968" fill="#c02c29">补齐缺口，数据连续</text></g><path d="m426 445 25 28m0-28-25 2